<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel de Histórias</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .carousel-container {
      max-width: 900px;
      width: 100%;
    }

    .carousel-main {
      position: relative;
      margin-bottom: 60px;
    }

    .carousel-slides {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      overflow: visible;
    }

    .slide {
      flex-shrink: 0;
      opacity: 0.6;
      transform: scale(0.75);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      filter: brightness(0.85);
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
      z-index: 10;
      filter: brightness(1);
    }

    .slide.prev,
    .slide.next {
      opacity: 0.7;
      transform: scale(0.8);
      filter: brightness(0.9);
    }

    .slide-image {
      width: 280px;
      height: 400px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      display: block;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .slide.active .slide-image {
      width: 360px;
      height: 500px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .slide-label {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #22c55e;
      color: #000;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .slide.active .slide-label {
      opacity: 1;
    }

    .slide-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      color: white;
      padding: 20px 16px;
      border-radius: 0 0 24px 24px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.4s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide.active .slide-footer {
      opacity: 1;
    }

    .slide-footer::before {
      content: '🏋️';
      font-size: 16px;
    }

    /* Controles */
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #22c55e;
      font-size: 20px;
    }

    .control-btn:hover {
      background: #22c55e;
      color: white;
      transform: scale(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.prev::before {
      content: '‹';
      font-size: 24px;
    }

    .control-btn.next::before {
      content: '›';
      font-size: 24px;
    }

    .dots-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1d5db;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .dot.active {
      background: #22c55e;
      width: 24px;
      border-radius: 4px;
    }

    .dot:hover {
      background: #a3e635;
    }

    /* Contador */
    .counter {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
    }

    .counter-text {
      margin-top: 16px;
      color: #999;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .slide-image {
        width: 250px;
        height: 350px;
      }

      .carousel-controls {
        gap: 16px;
      }

      .control-btn {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 480px) {
      .slide-image {
        width: 200px;
        height: 280px;
      }

      .carousel-slides {
        gap: 12px;
      }

      .slide {
        transform: scale(0.8);
      }

      .slide.active {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="carousel-container">
    <div class="carousel-main">
      <div class="carousel-slides" id="carouselSlides">
        <!-- Slides serão inseridas aqui -->
      </div>

      <div class="counter">
        <div id="counter"></div>
        <div class="counter-text">histórias</div>
      </div>
    </div>

    <div class="carousel-controls">
      <button class="control-btn prev" id="prevBtn"></button>
      <div class="dots-container" id="dotsContainer"></div>
      <button class="control-btn next" id="nextBtn"></button>
    </div>
  </div>

  <script>
    // Dados das histórias (você pode trocar pelas suas imagens)
    const stories = [
      {
        image: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=400&h=500&fit=crop',
        label: 'HISTÓRIA REAL',
        title: 'Começando na Academia',
        emoji: '🏋️'
      },
      {
        image: 'https://images.unsplash.com/photo-1517836357463-d25ddfcbf042?w=400&h=500&fit=crop',
        label: 'HISTÓRIA REAL',
        title: 'Treino Intenso',
        emoji: '💪'
      },
      {
        image: 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&h=500&fit=crop',
        label: 'HISTÓRIA REAL',
        title: 'Progresso Diário',
        emoji: '📈'
      },
      {
        image: 'https://images.unsplash.com/photo-1533615505841-ee62dfc5c16f?w=400&h=500&fit=crop',
        label: 'HISTÓRIA REAL',
        title: 'Meta Atingida',
        emoji: '🎉'
      }
    ];

    let currentIndex = 0;

    function init() {
      renderSlides();
      renderDots();
      updateCarousel();
      attachEventListeners();
    }

    function renderSlides() {
      const container = document.getElementById('carouselSlides');

      // Mostrar sempre 3 slides: anterior, atual, próximo
      const prevIndex = (currentIndex - 1 + stories.length) % stories.length;
      const nextIndex = (currentIndex + 1) % stories.length;
      const indices = [prevIndex, currentIndex, nextIndex];

      container.innerHTML = indices.map((idx) => {
        const story = stories[idx];
        const isActive = idx === currentIndex;
        const isPrev = idx === prevIndex;

        return `
                    <div class="slide ${isActive ? 'active' : isPrev ? 'prev' : 'next'}" data-index="${idx}">
                        <img src="${story.image}" alt="${story.title}" class="slide-image">
                        <span class="slide-label">${story.label}</span>
                        <div class="slide-footer">${story.title}</div>
                    </div>
                `;
      }).join('');
    }

    function renderDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = stories.map((_, idx) => `
                <div class="dot ${idx === currentIndex ? 'active' : ''}" data-index="${idx}"></div>
            `).join('');
    }

    function updateCarousel() {
      renderSlides();

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });

      document.getElementById('counter').textContent = `${currentIndex + 1} de ${stories.length}`;
    }

    function goToSlide(index) {
      currentIndex = (index + stories.length) % stories.length;
      updateCarousel();
    }

    function nextSlide() {
      goToSlide(currentIndex + 1);
    }

    function prevSlide() {
      goToSlide(currentIndex - 1);
    }

    function attachEventListeners() {
      document.getElementById('nextBtn').addEventListener('click', nextSlide);
      document.getElementById('prevBtn').addEventListener('click', prevSlide);

      document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
          goToSlide(parseInt(e.target.dataset.index));
        });
      });

      document.querySelectorAll('.slide').forEach(slide => {
        slide.addEventListener('click', (e) => {
          if (!e.target.closest('.slide-label')) {
            goToSlide(parseInt(e.target.closest('.slide').dataset.index));
          }
        });
      });

      // Teclado
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevSlide();
        if (e.key === 'ArrowRight') nextSlide();
      });
    }

    init();
  </script>
</body>

</html>
